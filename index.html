<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      padding: 40px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .project-button {
        align-items: center;
        justify-content: center;
      text-decoration: none;
      background-color: palevioletred;
      color: #ffffff;
      font-weight:700;
      font-size: 20px;
      padding: 15px 25px;
      width: 250px;
      text-align: center;
      border-radius: 8px;
      transition: transform 0.2s, background-color 0.3s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .project-button:hover {
      background-color: #94184e;
      transform: translateY(-3px);
    }

    .project-button:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      .project-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="project-button" href="./Projects/Crud_App/index.html">CRUD App</a>
    <a class="project-button" href="./Projects/Digital_watch(Mini_Project)/index.html">Digital Watch</a>
    <a class="project-button" href="./Projects/Joke_App/index.html">Joke App</a>
    <a class="project-button" href="./Projects/Number_Guessing_Game/Guessing_Number2/index.html">Number Guessing Game</a>
    <a class="project-button" href="./Projects/Stone_Paper_Scissor/index.html">Stone Paper Scissor</a>
    <a class="project-button" href="./Projects/StopWatch (Mini_Project)/Stopwatch.html">Stopwatch</a>
    <a class="project-button" href="./Projects/Tic_Tac_toe/index.html">Tic Tac Toe</a>
    <a class="project-button" href="./Projects/Todo App/index.html">Todo App</a>
  </div>
</body>
</html>
